name: Claude final review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Exact pull request head to review
        required: true
        type: string

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: adpablos/agent-system/.github/workflows/reusable-claude-final-review.yml@8ac6ec8dfaec9d72f017155aec48d4633a3d13f5
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
