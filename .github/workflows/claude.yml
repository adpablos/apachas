name: Claude final review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Exact pull request head to review
        required: true
        type: string

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: adpablos/agent-system/.github/workflows/reusable-claude-final-review.yml@d210f307378897035887538f8ca424f1aa8a991f
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
